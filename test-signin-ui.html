<!DOCTYPE html>
<html>
<head>
    <title>Sign-In Test</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>
    <h2>🔍 Test Sign-In Flow</h2>
    <div id="status">Ready to test...</div>
    <button onclick="testSignIn()">Test Sign-In</button>
    
    <script>
        const supabaseUrl = 'https://ulymixjoyuhapqxkcwbi.supabase.co'
        const supabaseAnonKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVseW1peGpveXVoYXBxeGtjd2JpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTMzMjU1NDQsImV4cCI6MjA2ODkwMTU0NH0.TKwAES_wwzZKSxkD-W7OvS0a_ujtGAuNdSfn0LE-vAM'
        
        const supabase = window.supabase.createClient(supabaseUrl, supabaseAnonKey)
        
        const status = document.getElementById('status')
        
        let loadingTimeout
        
        async function testSignIn() {
            status.innerHTML = 'Testing sign-in...'
            
            // Set a timeout to detect if loading hangs
            loadingTimeout = setTimeout(() => {
                status.innerHTML = '❌ Sign-in is taking too long - possible infinite loading!'
            }, 10000)
            
            try {
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: 'gym1admin@testvalidation.com',
                    password: 'SecurePass123!'
                })
                
                clearTimeout(loadingTimeout)
                
                if (error) {
                    status.innerHTML = `❌ Sign-in failed: ${error.message}`
                    return
                }
                
                status.innerHTML = '✅ Sign-in successful! Testing profile fetch...'
                
                // Test profile fetch
                const { data: profile, error: profileError } = await supabase
                    .from('profiles')
                    .select('gym_id, role, full_name')
                    .eq('id', data.user.id)
                    .single()
                    
                if (profileError) {
                    status.innerHTML = `❌ Profile fetch failed: ${profileError.message}`
                    return
                }
                
                status.innerHTML = `🎉 Complete success! User: ${profile.full_name} (${profile.role}) at gym ${profile.gym_id}`
                
                // Sign out
                await supabase.auth.signOut()
                
            } catch (err) {
                clearTimeout(loadingTimeout)
                status.innerHTML = `💥 Exception: ${err.message}`
            }
        }
    </script>
</body>
</html>
