name: Convex Database Backup

on:
  schedule:
    # Every 15 minutes for critical tables (meets RPO requirement)
    - cron: '*/15 * * * *'
    # Every 4 hours for full backup
    - cron: '0 */4 * * *'
    # Daily backup at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      backup_type:
        description: 'Type of backup to perform'
        required: false
        default: 'full'
        type: choice
        options:
        - critical
        - full
        - manual

env:
  CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
  BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}

jobs:
  backup-critical:
    # Run every 15 minutes and on manual trigger for critical
    if: github.event.schedule == '*/15 * * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.backup_type == 'critical')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Configure Convex
        run: |
          echo "CONVEX_DEPLOYMENT=${{ secrets.CONVEX_DEPLOYMENT }}" >> $GITHUB_ENV
          
      - name: Run Critical Tables Backup
        id: critical_backup
        run: |
          timestamp=$(date -u +"%Y%m%d_%H%M%S")
          backup_file="backup_critical_${timestamp}.zip"
          
          # Export full database (Convex CLI doesn't support selective tables)
          # Critical tables will be identified during restoration
          npx convex export --path "$backup_file"
            
          # Verify backup file exists and has content
          if [ ! -f "$backup_file" ] || [ ! -s "$backup_file" ]; then
            echo "❌ Backup file creation failed"
            exit 1
          fi
          
          file_size=$(stat -f%z "$backup_file" 2>/dev/null || stat -c%s "$backup_file")
          echo "backup_file=$backup_file" >> $GITHUB_OUTPUT
          echo "file_size=$file_size" >> $GITHUB_OUTPUT
          echo "timestamp=$timestamp" >> $GITHUB_OUTPUT
          
          # Calculate checksum for integrity verification
          checksum=$(shasum -a 256 "$backup_file" | cut -d' ' -f1)
          echo "checksum=$checksum" >> $GITHUB_OUTPUT
          
          echo "✅ Critical backup created: $backup_file (${file_size} bytes)"
          
      - name: Encrypt Backup
        if: steps.critical_backup.conclusion == 'success'
        run: |
          backup_file="${{ steps.critical_backup.outputs.backup_file }}"
          encrypted_file="${backup_file%.zip}_encrypted.zip.enc"
          
          # Encrypt using OpenSSL with AES-256
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 100000 \
            -in "$backup_file" \
            -out "$encrypted_file" \
            -k "$BACKUP_ENCRYPTION_KEY"
            
          # Remove unencrypted file
          rm "$backup_file"
          
          echo "encrypted_file=$encrypted_file" >> $GITHUB_ENV
          echo "✅ Backup encrypted successfully"
          
      - name: Upload to GitHub Release
        if: steps.critical_backup.conclusion == 'success'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: backup-critical-${{ steps.critical_backup.outputs.timestamp }}
          name: Critical Backup ${{ steps.critical_backup.outputs.timestamp }}
          body: |
            🔄 **Automated Critical Backup**
            
            - **Timestamp**: ${{ steps.critical_backup.outputs.timestamp }}
            - **Tables**: users, organizations, transactions, auditLogs, systemHealth, employees
            - **Size**: ${{ steps.critical_backup.outputs.file_size }} bytes
            - **Checksum**: ${{ steps.critical_backup.outputs.checksum }}
            - **Encryption**: AES-256-CBC
            - **Retention**: 7 days
            
            This backup meets the 15-minute RPO requirement for critical data.
          files: ${{ env.encrypted_file }}
          prerelease: true
          
      - name: Log Backup Operation
        if: always()
        run: |
          # This would integrate with Convex to log the backup operation
          echo "Logging backup operation to monitoring system"
          
          if [ "${{ steps.critical_backup.conclusion }}" = "success" ]; then
            status="success"
          else
            status="failed"
          fi
          
          npx tsx scripts/log-backup-operation.ts \
            --type "scheduled" \
            --tier "critical" \
            --tables "users,organizations,transactions,auditLogs,systemHealth,employees" \
            --status "$status" \
            --size "${{ steps.critical_backup.outputs.file_size }}" \
            --checksum "${{ steps.critical_backup.outputs.checksum }}" \
            --duration "${{ github.run_number }}"

  backup-full:
    # Run every 4 hours, daily, or on manual trigger for full
    if: github.event.schedule == '0 */4 * * *' || github.event.schedule == '0 2 * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.backup_type == 'full')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Configure Convex
        run: |
          echo "CONVEX_DEPLOYMENT=${{ secrets.CONVEX_DEPLOYMENT }}" >> $GITHUB_ENV
          
      - name: Run Full Database Backup
        id: full_backup
        run: |
          timestamp=$(date -u +"%Y%m%d_%H%M%S")
          backup_file="backup_full_${timestamp}.zip"
          
          # Export all tables
          npx convex export --path "$backup_file"
            
          # Verify backup file exists and has content
          if [ ! -f "$backup_file" ] || [ ! -s "$backup_file" ]; then
            echo "❌ Full backup file creation failed"
            exit 1
          fi
          
          file_size=$(stat -f%z "$backup_file" 2>/dev/null || stat -c%s "$backup_file")
          echo "backup_file=$backup_file" >> $GITHUB_OUTPUT
          echo "file_size=$file_size" >> $GITHUB_OUTPUT
          echo "timestamp=$timestamp" >> $GITHUB_OUTPUT
          
          # Calculate checksum for integrity verification
          checksum=$(shasum -a 256 "$backup_file" | cut -d' ' -f1)
          echo "checksum=$checksum" >> $GITHUB_OUTPUT
          
          echo "✅ Full backup created: $backup_file (${file_size} bytes)"
          
      - name: Encrypt Backup
        if: steps.full_backup.conclusion == 'success'
        run: |
          backup_file="${{ steps.full_backup.outputs.backup_file }}"
          encrypted_file="${backup_file%.zip}_encrypted.zip.enc"
          
          # Encrypt using OpenSSL with AES-256
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 100000 \
            -in "$backup_file" \
            -out "$encrypted_file" \
            -k "$BACKUP_ENCRYPTION_KEY"
            
          # Remove unencrypted file
          rm "$backup_file"
          
          echo "encrypted_file=$encrypted_file" >> $GITHUB_ENV
          echo "✅ Full backup encrypted successfully"
          
      - name: Upload to GitHub Release
        if: steps.full_backup.conclusion == 'success'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: backup-full-${{ steps.full_backup.outputs.timestamp }}
          name: Full Backup ${{ steps.full_backup.outputs.timestamp }}
          body: |
            📦 **Automated Full Database Backup**
            
            - **Timestamp**: ${{ steps.full_backup.outputs.timestamp }}
            - **Tables**: All database tables
            - **Size**: ${{ steps.full_backup.outputs.file_size }} bytes
            - **Checksum**: ${{ steps.full_backup.outputs.checksum }}
            - **Encryption**: AES-256-CBC
            - **Retention**: 30 days
            - **Trigger**: ${{ github.event_name == 'schedule' && 'Scheduled' || 'Manual' }}
            
            This backup provides complete database snapshot for disaster recovery.
          files: ${{ env.encrypted_file }}
          prerelease: false
          
      - name: Log Backup Operation
        if: always()
        run: |
          echo "Logging full backup operation to monitoring system"
          
          if [ "${{ steps.full_backup.conclusion }}" = "success" ]; then
            status="success"
          else
            status="failed"
          fi
          
          npx tsx scripts/log-backup-operation.ts \
            --type "scheduled" \
            --tier "standard" \
            --tables "all" \
            --status "$status" \
            --size "${{ steps.full_backup.outputs.file_size }}" \
            --checksum "${{ steps.full_backup.outputs.checksum }}" \
            --duration "${{ github.run_number }}"

  cleanup-old-backups:
    # Run daily to clean up expired backups
    if: github.event.schedule == '0 2 * * *'
    runs-on: ubuntu-latest
    
    steps:
      - name: Cleanup Old Releases
        uses: dev-drprasad/delete-older-releases@v0.3.2
        with:
          keep_latest: 48  # Keep 48 releases (2 days worth of 15-min backups)
          delete_tag_pattern: backup-critical-
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Cleanup Old Full Backups
        uses: dev-drprasad/delete-older-releases@v0.3.2
        with:
          keep_latest: 30  # Keep 30 full backups (30 days retention)
          delete_tag_pattern: backup-full-
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backup-health-check:
    # Run every hour to monitor backup health
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Check Backup Health
        run: |
          # Query Convex for backup health status
          health_status=$(npx tsx scripts/check-backup-health.ts)
          echo "Backup health status: $health_status"
          
          # Parse health status and fail job if critical issues
          if echo "$health_status" | grep -q '"status":"warning"'; then
            echo "⚠️ Backup system has warnings"
            exit 0  # Don't fail job for warnings
          elif echo "$health_status" | grep -q '"rpoCompliant":false'; then
            echo "❌ RPO violation detected - critical backup system issue"
            exit 1  # Fail job for RPO violations
          else
            echo "✅ Backup system healthy"
          fi

  notify-on-failure:
    if: failure()
    runs-on: ubuntu-latest
    needs: [backup-critical, backup-full, backup-health-check]
    
    steps:
      - name: Notify on Backup Failure
        run: |
          echo "🚨 BACKUP SYSTEM FAILURE DETECTED"
          echo "Job: ${{ github.job }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "Timestamp: $(date -u)"
          
          # In production, this would send notifications to:
          # - Slack/Discord channels
          # - Email alerts
          # - PagerDuty incidents
          # - SMS notifications for critical failures
          
          echo "Backup failure notifications would be sent to operations team"